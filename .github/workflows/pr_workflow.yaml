name: PR Validator - Build and Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'lerna.json'
      - '**/package-lock.json'
      - '**/package.json'
  push:
    branches:
      - main
    paths-ignore:
      - 'lerna.json'
      - '**/package-lock.json'
      - '**/package.json'

jobs:
  build-and-test:
    runs-on: ubuntu-x64
    permissions:
      contents: read
      id-token: write # Artifactory exchanges this for an access token to install with
    env:
      ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
      ARTIFACTORY_NPM_REGISTRY: ${{ vars.ARTIFACTORY_URL }}/artifactory/api/npm/virtual-npm-thirdparty/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # Installs from the curated Artifactory repository, the same way a release
      # does, so that a version curation forbids fails here on the pull request
      # rather than part-way through an alpha release.
      #
      # The lockfile's resolved URLs all name registry.npmjs.org, but npm
      # rewrites a resolved host matching replaceRegistryHost (which defaults to
      # registry.npmjs.org) to whatever --registry says, so the tarballs come
      # from Artifactory.
      - name: Install project dependencies (curated Artifactory)
        run: |
          installed=false
          for i in 1 2 3; do # Retry logic, retry 3 times
            # Artifactory's OIDC token lasts about ten minutes, so take a fresh
            # one per attempt and keep each attempt inside that window.
            .github/scripts/artifactory-npm-auth.sh
            echo "Starting npm ci against $ARTIFACTORY_NPM_REGISTRY (attempt $i/3, 8-minute timeout)"
            if timeout 8m npm ci --registry="$ARTIFACTORY_NPM_REGISTRY" --verbose; then
              installed=true
              break
            fi
            echo "npm ci failed, retrying ($i/3)..."
          done
          if [ "$installed" != true ]; then
            echo "::error::npm ci failed after 3 attempts"
            exit 1
          fi
      - name: Run linter
        run: npm run lint:fix
      - name: Run Tests
        run: npm run test:ci
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID_linux }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN_linux }}
          NODE_OPTIONS: --no-experimental-fetch
          CI: ""
      - name: Build packages
        run: npm run build

  