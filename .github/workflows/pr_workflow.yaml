name: PR Validator - Build and Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'lerna.json'
      - '**/package-lock.json'
      - '**/package.json'
  push:
    branches:
      - main
    paths-ignore:
      - 'lerna.json'
      - '**/package-lock.json'
      - '**/package.json'

jobs:
  build-and-test:
    runs-on: twilio-internal-ubuntu-latest-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '22'
      - name: Install project dependencies
        run: |
          echo "Starting npm ci with a 10-minute timeout"
          for i in 1 2 3; do # Retry logic, retry 3 times
            timeout 10m npm ci --verbose && break || echo "npm ci failed, retrying ($i/3)..."
          done
      - name: Run linter
        run: npm run lint:fix
      - name: Run Tests
        run: npm run test:ci
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID_linux }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN_linux }}
          NODE_OPTIONS: --no-experimental-fetch
          CI: ""
      - name: Build packages
        run: npm run build
      # - name: Codecov report
      #   uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}

  