on:
  workflow_call:
    inputs:
      TAG:
        description: "A tag passed from the caller workflow, it decides the type of release. Allowed values are [rc | beta | alpha | public | dev]"
        required: true
        type: string
      VERSION:
        description: "A specific version passed from the caller workflow which will be release as it is."
        required: true
        type: string
      BRANCH:
        description: "A branch passed from the caller workflow, it decides which branch will be pushed to npm."
        required: true
        type: string
      ENVIRONMENT:
        description: "A environment passed from the caller workflow, it controls the reviewing process of a release."
        required: true
        type: string
        default: alpha_release
    secrets:
      NODE_AUTH_TOKEN:
        required: true
      SLACK_WEB_HOOK:
        required: true

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  publish:
    runs-on: ubuntu-x64
    environment: ${{ inputs.ENVIRONMENT }}
    permissions:
      id-token: write # Required for Artifactory OIDC
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Authenticate with Artifactory
        uses: ./.github/actions/artifactory-oidc
      - name: Install dependencies
        run: |
          echo "Starting npm ci with a 10-minute timeout"
          for i in 1 2 3; do # Retry logic, retry 3 times
            timeout 10m npm ci --verbose && break
            if [ "$i" -eq 3 ]; then
              echo "::error::npm ci failed after 3 attempts"
              exit 1
            fi
            echo "npm ci failed, retrying ($i/3)..."
          done
      - name: Publish Version
        run: npm run publish:${{ inputs.TAG }} ${{ inputs.VERSION }}
        env:
          VERSION: ${{ inputs.VERSION }}
          BRANCH: ${{ inputs.BRANCH }}
          NODE_OPTIONS: --no-experimental-fetch
          CI: ""
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Slack Notification
        run: |
          curl -X POST "${{ secrets.SLACK_WEB_HOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"username\": \"Github Actions\",
              \"icon_emoji\": \":ship:\",
              \"attachments\": [{
                \"color\": \"${{ job.status == 'success' && 'good' || 'danger' }}\",
                \"title\": \"Flex Plugins CLI\",
                \"text\": \"🎉 Released a new version with *tag* \\\`${{ inputs.TAG }}\\\` and *version* \\\`${{ inputs.VERSION }}\\\`\",
                \"actions\": [{
                  \"type\": \"button\",
                  \"text\": \"View Action\",
                  \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                }]
              }]
            }"
