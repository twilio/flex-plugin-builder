on:
  workflow_call:
    inputs:
      TAG:
        description: 'A tag passed from the caller workflow, it decides the type of release. Allowed values are [rc | beta | alpha | public | dev]'
        required: true
        type: string
      VERSION:
        description: 'A specific version passed from the caller workflow which will be release as it is.'
        required: true
        type: string
      BRANCH:
        description: 'A branch passed from the caller workflow, it decides which branch will be pushed to npm.'
        required: true
        type: string
      ENVIRONMENT:
        description: 'A environment passed from the caller workflow, it controls the reviewing process of a release.'
        required: true
        type: string
        default: production
    secrets:
      SLACK_WEB_HOOK:
        required: true
      G_TOKEN:
        required: false
      APP_ID:
        required: false
      APP_KEY:
        required: false

jobs:
  publish:
    runs-on: ubuntu-x64
    environment: ${{ inputs.ENVIRONMENT }}
    permissions:
      # Used twice over: Artifactory exchanges it for an access token to install
      # with, and npm exchanges it for a registry token to publish with.
      id-token: write
      contents: write # the public release pushes a version-bump branch
    env:
      ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
      ARTIFACTORY_NPM_REGISTRY: ${{ vars.ARTIFACTORY_URL }}/artifactory/api/npm/virtual-npm-thirdparty/
    steps:
      - name: Create GitHub App token (public releases only)
        if: inputs.TAG == 'public'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: get_app_token
        with:
          client-id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No registry-url on purpose. Given one, setup-node writes an .npmrc with
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and, with no token
      # supplied, exports NODE_AUTH_TOKEN as the literal placeholder
      # XXXXX-XXXXX-XXXXX-XXXXX. npm then has a credential, uses it, and never
      # attempts the OIDC exchange, so trusted publishing is bypassed and the
      # registry rejects the placeholder with a 404. The publish step passes
      # --registry explicitly instead.
      # Node 24 for the npm it bundles: trusted publishing needs npm >= 11.5.1.
      # This matches flex-monorepo, which publishes through OIDC successfully,
      # and avoids upgrading npm globally mid-job.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      # Dependencies come from the curated Artifactory repository, so a release
      # is built against the versions curation actually allows. Only the install
      # is redirected: the default registry stays on public npm so the publish
      # below can use npm trusted publishing.
      #
      # The lockfile's resolved URLs all name registry.npmjs.org, but npm
      # rewrites a resolved host that matches replaceRegistryHost (which
      # defaults to registry.npmjs.org) to whatever --registry says, so the
      # tarballs are fetched from Artifactory.
      # Install and build are deliberately disabled: this job only publishes
      # what is already built. Re-enable both to go back to building here.
      #
      # - name: Install dependencies (curated Artifactory)
      #   run: |
      #     installed=false
      #     for i in 1 2 3; do # Retry logic, retry 3 times
      #       # Artifactory's OIDC token lasts about ten minutes, so take a fresh
      #       # one per attempt and keep each attempt inside that window.
      #       .github/scripts/artifactory-npm-auth.sh
      #       echo "Starting npm ci against $ARTIFACTORY_NPM_REGISTRY (attempt $i/3, 8-minute timeout)"
      #       if timeout 8m npm ci --registry="$ARTIFACTORY_NPM_REGISTRY" --verbose; then
      #         installed=true
      #         break
      #       fi
      #       echo "npm ci failed, retrying ($i/3)..."
      #     done
      #     if [ "$installed" != true ]; then
      #       echo "::error::npm ci failed after 3 attempts"
      #       exit 1
      #     fi
      #
      # - name: Build packages
      #   run: |
      #     npm run lint:fix
      #     npm run build

      - name: Slack Started Notification (public releases only)
        if: inputs.TAG == 'public'
        run: |
          curl -X POST "${{ secrets.SLACK_WEB_HOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"username\": \"Github Actions\",
              \"icon_emoji\": \":ship:\",
              \"attachments\": [{
                \"color\": \"good\",
                \"title\": \"Flex Plugins CLI\",
                \"text\": \":ship_it_parrot: Releasing new public *version* of \\\`flex-plugin-builder\\\`\",
                \"actions\": [{
                  \"type\": \"button\",
                  \"text\": \"View Action\",
                  \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                }]
              }]
            }"

      # Publishes each package's already-built dist through the npm CLI, one
      # package at a time, so that npm trusted publishing (OIDC) authenticates
      # every upload. bin/publish is not used here: it drives lerna, whose
      # bundled libnpmpublish predates OIDC and needs NODE_AUTH_TOKEN, and it
      # would need the node_modules that the disabled install no longer provides.
      - name: Publish Version
        run: |
          set -euo pipefail

          if [ "${{ inputs.TAG }}" = "public" ]; then
            git config user.name github-actions
            git config user.email noreply@github.com
            distTag="latest"
          else
            distTag="${{ inputs.TAG }}"
          fi

          # Versions are stamped by editing the manifests directly. lerna is
          # unavailable without node_modules, and `npm version --workspaces`
          # resolves the whole dependency tree and rewrites the lockfile, which
          # takes minutes here and is not wanted in a publish-only job.
          #
          # Internal cross-dependencies are pinned to the same exact version,
          # which is what `lerna version --exact` did. Without that, every
          # published package would still depend on the previous release.
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const files = fs
              .readdirSync("packages")
              .map((d) => `packages/${d}/package.json`)
              .filter((f) => fs.existsSync(f));
            const manifests = files.map((f) => [f, JSON.parse(fs.readFileSync(f, "utf8"))]);
            const local = new Set(manifests.map(([, p]) => p.name));
            const fields = ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"];
            for (const [file, pkg] of manifests) {
              pkg.version = version;
              for (const field of fields) {
                for (const dep of Object.keys(pkg[field] || {})) {
                  if (local.has(dep)) pkg[field][dep] = version;
                }
              }
              fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
            }
            console.log(`stamped ${manifests.length} packages at ${version}`);
          '

          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue

            name=$(node -p "require('./${dir}package.json').name")
            if [ "$(node -p "require('./${dir}package.json').private === true")" = "true" ]; then
              echo "skipping ${name}: private"
              continue
            fi

            # Every package publishes files: ["dist"]. Without a dist the upload
            # would succeed and put an empty package on npm at a version number
            # that can never be reused, so stop instead.
            if [ ! -d "${dir}dist" ]; then
              echo "::error::${name} has no ${dir}dist to publish; build it before releasing"
              exit 1
            fi

            echo "Publishing ${name}@${VERSION} from ${dir}"
            (
              cd "$dir"
              # --ignore-scripts because plugin-flex's prepack shells out to
              # node_modules/.bin/oclif-dev, which the disabled install no
              # longer provides. Its oclif.manifest.json is committed instead,
              # so nothing is lost; skipping postpack also stops it deleting
              # that committed file.
              # --registry is spelled exactly as flex-monorepo spells it, which
              # publishes through OIDC successfully. An earlier guess that the
              # missing trailing slash was making npm skip trusted publishing
              # was wrong: that repo passes the same form and it works.
              #
              # --verbose so npm's OIDC token-exchange attempt is visible. At
              # default verbosity a failed exchange is silent and shows up only
              # as ENEEDAUTH, which is indistinguishable from never trying.
              npm publish \
                --registry https://registry.npmjs.org \
                --tag "$distTag" \
                --access public \
                --ignore-scripts \
                --provenance \
                --verbose
            )
          done
        env:
          VERSION: ${{ inputs.VERSION }}
          BRANCH: ${{ inputs.BRANCH }}
          CI: ''
          # NODE_OPTIONS is gone with the move to node 24, which no longer
          # accepts --no-experimental-fetch. Nothing here needs it: the step
          # only runs a node script and npm publish.
          #
          # No NODE_AUTH_TOKEN: the npm CLI authenticates via OIDC trusted publishing.

      - name: Retrieve Version (public releases only)
        if: inputs.TAG == 'public'
        id: publicVersion
        run: |
          echo "version=$(awk '/version/{gsub(/("|",)/,"",$2);print $2}' lerna.json)"
          echo "version=$(awk '/version/{gsub(/("|",)/,"",$2);print $2}' lerna.json)" >> "$GITHUB_OUTPUT"

      - name: Slack Completion Notification
        if: always()
        run: |
          STATUS_COLOR="good"
          if [ "${{ job.status }}" = "failure" ]; then
            STATUS_COLOR="danger"
          elif [ "${{ job.status }}" = "cancelled" ]; then
            STATUS_COLOR="warning"
          fi

          if [ "${{ inputs.TAG }}" = "public" ]; then
            MESSAGE="🎉:tada: Released a new public *version* \\\`${{ steps.publicVersion.outputs.version }}\\\`"
          else
            MESSAGE="🎉 Released a new version with *tag* \\\`${{ inputs.TAG }}\\\` and *version* \\\`${{ inputs.VERSION }}\\\`"
          fi

          curl -X POST "${{ secrets.SLACK_WEB_HOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"username\": \"Github Actions\",
              \"icon_emoji\": \":ship:\",
              \"attachments\": [{
                \"color\": \"${STATUS_COLOR}\",
                \"title\": \"Flex Plugins CLI\",
                \"text\": \"${MESSAGE}\",
                \"actions\": [{
                  \"type\": \"button\",
                  \"text\": \"View Action\",
                  \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                }]
              }]
            }"

      - name: Commit Version (public releases only)
        if: inputs.TAG == 'public'
        id: commit_version
        run: |
          git checkout -b bump-version-"$VERSION_NUMBER"
          git push origin bump-version-"$VERSION_NUMBER" --no-verify
        env:
          VERSION_NUMBER: ${{ steps.publicVersion.outputs.version }}

      - name: Create PR for version (public releases only)
        if: inputs.TAG == 'public'
        run: |
          gh pr create --base main --title "Update version" --body "Update version"
        env:
          GITHUB_TOKEN: ${{ steps.get_app_token.outputs.token }}

      - name: Approve and Merge PR (public releases only)
        if: inputs.TAG == 'public'
        run: |
          gh pr review --approve
          gh pr merge --auto --merge
        env:
          GITHUB_TOKEN: ${{ secrets.G_TOKEN }}
